# Сборка релиза по пушу тега v<версия>: git tag v1.2.0 && git push origin v1.2.0
# Собираем на Ubuntu 22.04: бинарник привязан к glibc и работает на ней и новее.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверка версии тега
        run: |
          version="$(/usr/bin/python3 -c 'from app_core.constants import APP_VERSION; print(APP_VERSION)')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Тег $GITHUB_REF_NAME не совпадает с APP_VERSION = $version в app_core/constants.py"
              exit 1
          fi

      # PyGObject и pycairo берём из apt; python3-dev нужен Nuitka и для сборки evdev (pynput).
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev python3-gi python3-gi-cairo \
              gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 build-essential patchelf zip

      - name: Окружение Python
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-build.txt

      - name: Сборка
        run: ./build.sh

      - name: Публикация релиза
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          files: |
            dist/symo_*_amd64.deb
            dist/SyMo-*-linux-x86_64.tar.gz
            dist/SyMo-*-linux-x86_64.tar.gz.sha256
            dist/symo-launcher-gnome-*.shell-extension.zip
