# Сборка релиза по пушу тега v<версия>: git tag v1.2.0 && git push origin v1.2.0
# Собираем на Ubuntu 22.04: бинарник привязан к glibc и работает на ней и новее.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Проверка версии тега
        run: |
          version="$(/usr/bin/python3 -c 'from app_core.constants import APP_VERSION; print(APP_VERSION)')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "::error::Тег $GITHUB_REF_NAME не совпадает с APP_VERSION = $version в app_core/constants.py"
              exit 1
          fi

      # PyGObject и pycairo берём из apt; python3-dev нужен Nuitka и для сборки evdev (pynput).
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev python3-gi python3-gi-cairo \
              gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 build-essential patchelf zip

      - name: Окружение Python
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-build.txt

      - name: Сборка
        run: ./build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.runner }}
          path: dist/*.*
          if-no-files-found: error

  # Публикует один job, чтобы две сборки не создавали релиз одновременно.
  release:
    needs: build
    runs-on: ubuntu-22.04
    # id-token и attestations — для подписи происхождения файлов релиза.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Подпись «собрано этим workflow из этого коммита»; проверка у пользователя:
      # gh attestation verify symo_*.deb -R OlegEgoism/SyMo
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.shell-extension.zip

      - name: Публикация релиза
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/symo_*_amd64.deb
            dist/symo_*_arm64.deb
            dist/SyMo-*-linux-x86_64.tar.gz
            dist/SyMo-*-linux-x86_64.tar.gz.sha256
            dist/SyMo-*-linux-aarch64.tar.gz
            dist/SyMo-*-linux-aarch64.tar.gz.sha256
            dist/symo-launcher-gnome-*.shell-extension.zip

  # Подписанный apt-репозиторий на GitHub Pages (ветка gh-pages): после подключения
  # SyMo обновляется через apt. Работает, когда в секретах есть APT_GPG_PRIVATE_KEY;
  # без него шаги пропускаются и релиз выходит как обычно.
  apt-repo:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.APT_GPG_PRIVATE_KEY != ''

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.APT_GPG_PRIVATE_KEY != ''
        with:
          path: dist
          merge-multiple: true

      - name: Сборка и публикация репозитория
        if: env.APT_GPG_PRIVATE_KEY != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          command -v dpkg-scanpackages >/dev/null || sudo apt-get install -y dpkg-dev
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          ./build-apt-repo.sh dist site
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "APT repository for $GITHUB_REF_NAME"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
